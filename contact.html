<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - La Bella Vita</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        line-height: 1.6;
        background-color: #fff;
        color: #333;
      }
      header {
        background: #111;
        color: #fff;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
      }
      header h1 {
        font-size: 1.5rem;
        letter-spacing: 2px;
      }
      nav ul {
        display: flex;
        list-style: none;
      }
      nav ul li a {
        color: #fff;
        text-decoration: none;
        padding: 0.5rem 1rem;
        transition: background 0.3s ease;
      }
      nav ul li a:hover {
        background: #e0a80d;
        border-radius: 5px;
      }
      .hero {
        width: 100%;
        height: 50vh;
        background-image: url(C:/Users/malna/Downloads/13678.jpg);
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .hero-text {
        color: #fff;
        padding: 20px;
        border-radius: 10px;
      }
      .hero-text h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }
      .contact-section {
        padding: 50px 20px;
        background: #f9f9f9;
      }
      .contact-container {
        max-width: 800px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .contact-container h2 {
        margin-bottom: 20px;
        text-align: center;
        color: #b71c1c;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      label {
        margin: 10px 0 5px;
        font-weight: bold;
      }
      input,
      textarea {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      button {
        margin-top: 15px;
        padding: 12px;
        background: #b71c1c;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s;
      }
      button:hover {
        background: #d32f2f;
      }
      footer {
        background: #111;
        color: #ddd;
        text-align: center;
        padding: 2rem;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Ruxton Elite</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-text">
        <h1>Contact Us</h1>
        <p>We’d love to hear from you!</p>
      </div>
    </section>

    <section class="contact-section">
      <div class="contact-container">
        <h2>Send Us a Message</h2>
        <form action="contacts.php" method="POST">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your Name"
            required
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Your Email"
            required
          />

          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Your Message"
            required
          ></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>
    </section>

    <footer>
      <p>&copy;2026 Ruxton Elite. All rights reserved.</p>
    </footer>
  </body>
</html>
